server:
  port: 8082 # Puerto diferente para evitar conflictos con el cache-service (8081)

spring:
  application:
    name: traza-service
  datasource:
    url: jdbc:postgresql://localhost:5433/index_logic_db
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update # Crea o actualiza las tablas automáticamente en desarrollo
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect